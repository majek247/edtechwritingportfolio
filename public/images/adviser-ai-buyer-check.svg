<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="620" viewBox="0 0 1320 620">
<rect width="1320" height="620" rx="34" fill="#f5f8f2"/>
<text x="58" y="70" font-family="Arial" font-size="14" letter-spacing="3" fill="#58705d">ADVICE-FIRM AI BUYER CHECK</text>
<text x="58" y="115" font-family="Georgia" font-size="34" fill="#173a2b">What needs to survive the demo</text>
<g font-family="Arial">
  <g transform="translate(58 160)"><rect width="282" height="160" rx="18" fill="#fff" stroke="#dbe4d8"/><circle cx="42" cy="42" r="20" fill="#e8f5e4"/><text x="36" y="49" font-size="16" fill="#39724a">1</text><text x="26" y="90" font-size="16" fill="#1f402f">Meeting record</text><text x="26" y="118" font-size="12" fill="#758377">Capture what was said,</text><text x="26" y="138" font-size="12" fill="#758377">not just a generic summary.</text></g>
  <g transform="translate(370 160)"><rect width="282" height="160" rx="18" fill="#fff" stroke="#dbe4d8"/><circle cx="42" cy="42" r="20" fill="#e8f5e4"/><text x="36" y="49" font-size="16" fill="#39724a">2</text><text x="26" y="90" font-size="16" fill="#1f402f">Advice output</text><text x="26" y="118" font-size="12" fill="#758377">Notes, actions and</text><text x="26" y="138" font-size="12" fill="#758377">documents advisers can use.</text></g>
  <g transform="translate(682 160)"><rect width="282" height="160" rx="18" fill="#fff" stroke="#dbe4d8"/><circle cx="42" cy="42" r="20" fill="#e8f5e4"/><text x="36" y="49" font-size="16" fill="#39724a">3</text><text x="26" y="90" font-size="16" fill="#1f402f">CRM handoff</text><text x="26" y="118" font-size="12" fill="#758377">What gets written back,</text><text x="26" y="138" font-size="12" fill="#758377">and what still gets re-keyed?</text></g>
  <g transform="translate(994 160)"><rect width="268" height="160" rx="18" fill="#fff" stroke="#dbe4d8"/><circle cx="42" cy="42" r="20" fill="#e8f5e4"/><text x="36" y="49" font-size="16" fill="#39724a">4</text><text x="26" y="90" font-size="16" fill="#1f402f">Suitability</text><text x="26" y="118" font-size="12" fill="#758377">Drafting support without</text><text x="26" y="138" font-size="12" fill="#758377">hiding human approval.</text></g>
  <g transform="translate(214 350)"><rect width="282" height="160" rx="18" fill="#fff" stroke="#dbe4d8"/><circle cx="42" cy="42" r="20" fill="#e8f5e4"/><text x="36" y="49" font-size="16" fill="#39724a">5</text><text x="26" y="90" font-size="16" fill="#1f402f">Evidence</text><text x="26" y="118" font-size="12" fill="#758377">Can a reviewer trace</text><text x="26" y="138" font-size="12" fill="#758377">the output to the source?</text></g>
  <g transform="translate(526 350)"><rect width="282" height="160" rx="18" fill="#fff" stroke="#dbe4d8"/><circle cx="42" cy="42" r="20" fill="#e8f5e4"/><text x="36" y="49" font-size="16" fill="#39724a">6</text><text x="26" y="90" font-size="16" fill="#1f402f">Data handling</text><text x="26" y="118" font-size="12" fill="#758377">Where data lives and</text><text x="26" y="138" font-size="12" fill="#758377">whether it trains models.</text></g>
  <g transform="translate(838 350)"><rect width="282" height="160" rx="18" fill="#0d3024" stroke="#194735"/><circle cx="42" cy="42" r="20" fill="#244c39"/><text x="36" y="49" font-size="16" fill="#a7eab0">7</text><text x="26" y="90" font-size="16" fill="#edf8ee">Human control</text><text x="26" y="118" font-size="12" fill="#a8c2ae">Review, correct and approve</text><text x="26" y="138" font-size="12" fill="#a8c2ae">before the record is filed.</text></g>
</g>
</svg>